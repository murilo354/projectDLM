<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TRINITY REPORT</title>
  <style>
    body {
      background-color: #0c0c0c;
      color: #e6e6e6;
      font-family: "Courier New", monospace;
      padding: 40px;
    }
    h1 {
      color: #ff4444;
      text-align: center;
    }
    .aviso {
      background-color: #330000;
      color: #ff9999;
      padding: 10px;
      border: 1px solid #ff4444;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .login-box {
      background-color: #111;
      padding: 20px;
      border: 1px solid #444;
      border-radius: 6px;
      margin-top: 20px;
    }
    input[type="text"] {
      background-color: #222;
      border: none;
      color: #e6e6e6;
      padding: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      background-color: #ff4444;
      color: white;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
    }
    .response {
      margin-top: 20px;
      color: #00cc66;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>TRINITY REPORT</h1>

  <div class="aviso">
    Este site contém arquivos simulados para fins investigativos e narrativos. Todo conteúdo é fictício.
  </div>

  <div class="login-box">
    <label for="code">Digite a Palavra de Convocação:</label>
    <input type="text" id="code">
    <button onclick="validateCode()">Enviar</button>
    <div class="response" id="response"></div>
  </div>

  <script>
    function validateCode() {
      const input = document.getElementById("code").value.trim();
      const responseBox = document.getElementById("response");

      // Senhas em Base64
      const validCodes = {
        "U1BFQ1VMVU0=": "ACESSO NÍVEL 1 LIBERADO\nRelatório Básico: Acesso inicial\nFrase: 'A unidade investigadora não deve interagir com os objetos de fé.'\n\nVeil of God protocol: O velcro divino é um protocolo ajustado automaticamente quando seu risco e proximidade a en꧅ဪ seja elevado.",
        "VmlnYWlhbnRlIHZvY8OqIHF1ZSBhIGZhcmlhIG5vIGNyZXUgZGUgRGlldXM/": "ACESSO NÍVEL 2 LIBERADO\nRelatório Confidencial: Unidade X-07\nFrase: 'Seu mundo foi traçado, este não foi escrito. É por isso que estamos aqui, observando o erro.'",
        "b0M6IHdpbW5vIGVuaWVt": "ACESSO NÍVEL 3 LIBERADO\nRelatório Final: Observações Anômalas\nFrase: 'O que acontece quando um Deus não observa?'"
      };

      try {
        const decodedInput = atob(input);
        if (validCodes[input]) {
          responseBox.innerText = validCodes[input];
        } else {
          responseBox.innerText = "Código inválido. Tente novamente.";
        }
      } catch (error) {
        responseBox.innerText = "Código inválido. Tente novamente.";
      }
    }
  </script>
</body>
</html>
